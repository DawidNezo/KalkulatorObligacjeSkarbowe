# The quality gates live in Directory.Build.props: a build with any warning
# fails, thus one test step is all the CI needs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Bonds.sln --configuration Release
